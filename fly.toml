# Ajuste "app" para o nome escolhido no `fly launch`.
app = "planner-social"
primary_region = "gru"

[build]

[deploy]
  release_command = "alembic upgrade head"

[env]
  COOKIE_SECURE = "true"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
