# fly.toml app configuration file generated for social-media-green-wildflower-6858 on 2026-10-18T19:18:36-03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'social-media-green-wildflower-6858'
primary_region = 'gru'
# Memória de emergência em disco: picos (ex.: create-admin junto com o app) não matam o processo.
swap_size_mb = 512

[build]
[deploy]
  release_command = 'alembic upgrade head'

[env]
  COOKIE_SECURE = 'true'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
